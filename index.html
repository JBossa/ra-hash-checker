<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>RA Hash Checker</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header>
      <h1>RA Hash Checker</h1>
      <button id="settings-btn" type="button" aria-label="Settings">⚙</button>
    </header>
    <main>
      <div id="drop" class="drop" role="button" tabindex="0">
        <p id="drop-text"></p>
        <p id="no-key" class="no-key" hidden>
          <span id="no-key-text"></span>
          <a id="get-key" href="#"></a>
        </p>
      </div>
      <div id="results"></div>
    </main>
    <dialog id="settings">
      <form method="dialog">
        <h2 id="settings-title"></h2>
        <label id="key-label" for="api-key"></label>
        <input id="api-key" type="password" autocomplete="off" spellcheck="false" />
        <p id="key-hint" class="hint"></p>
        <div class="actions">
          <button id="save-key" type="submit"></button>
          <button id="refresh" type="button"></button>
        </div>
        <p id="last-refresh" class="hint"></p>
        <p id="settings-msg" class="hint" role="status"></p>
        <div class="actions"><button id="close-settings" type="button"></button></div>
      </form>
    </dialog>
  </body>
</html>
